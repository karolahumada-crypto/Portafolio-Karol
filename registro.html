<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AdoptaApp PRO</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
  background: linear-gradient(-45deg, #6d28d9, #c084fc, #e879f9, #9333ea);
  background-size: 400% 400%;
  animation: fondo 10s ease infinite;
  color:white;
}
@keyframes fondo {
  0% {background-position: 0% 50%;}
  50% {background-position: 100% 50%;}
  100% {background-position: 0% 50%;}
}
.card{
  background: rgba(255,255,255,0.2);
  border-radius:20px;
}
.oculto{display:none;}
.mascota-card{
  background: rgba(0,0,0,0.4);
  padding:15px;
  margin-top:10px;
  display:flex;
  gap:15px;
  border-radius:15px;
}
.mascota-card img{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:10px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<main class="container mt-5" id="loginSection">
<section class="card p-4 text-center">

<h2>🔐 Iniciar Sesión</h2>

<input id="loginUser" class="form-control mt-3" placeholder="Usuario">
<input type="password" id="loginPass" class="form-control mt-3" placeholder="Contraseña">

<button class="mt-4 w-100 btn btn-dark" onclick="login()">Entrar</button>

<p class="mt-3"><a onclick="mostrarRegistro()">Registrarse</a></p>

<p id="msg"></p>

</section>
</main>

<!-- REGISTRO -->
<main class="container mt-5 oculto" id="registroSection">
<section class="card p-4 text-center">

<h2>📝 Registro</h2>

<input id="regUser" class="form-control mt-3" placeholder="Usuario">
<input type="password" id="regPass" class="form-control mt-3" placeholder="Contraseña">

<button class="mt-4 w-100 btn btn-success" onclick="registrar()">Crear cuenta</button>

<p class="mt-3"><a onclick="mostrarLogin()">Volver</a></p>

<p id="msgReg"></p>

</section>
</main>

<!-- APP -->
<section id="appSection" class="oculto">
<div class="container mt-4">
<h2 id="bienvenida"></h2>

<button class="btn btn-danger" onclick="logout()">Cerrar sesión</button>

<div id="listaMascotas"></div>
</div>
</section>

<script>

// DATOS
let usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];
let mascotas = JSON.parse(localStorage.getItem("mascotas")) || [];

// REGISTRO MEJORADO
function registrar(){

let user = regUser.value.trim();
let pass = regPass.value.trim();

if(!user || !pass){
msgReg.textContent="❌ Completa todos los campos";
return;
}

if(usuarios.some(u=>u.user===user)){
msgReg.textContent="⚠️ Usuario ya existe";
return;
}

usuarios.push({user,pass});
localStorage.setItem("usuarios",JSON.stringify(usuarios));

msgReg.textContent="✅ Cuenta creada";
}

// LOGIN ARREGLADO
function login(){

let user = loginUser.value.trim();
let pass = loginPass.value.trim();

if(!user || !pass){
msg.textContent="❌ Ingresa usuario y contraseña";
return;
}

let u = usuarios.find(x=>x.user===user && x.pass===pass);

if(!u){
msg.textContent="❌ Usuario o contraseña incorrectos";
return;
}

localStorage.setItem("usuarioActivo",user);
iniciarApp();
}

// APP
function iniciarApp(){
loginSection.classList.add("oculto");
registroSection.classList.add("oculto");
appSection.classList.remove("oculto");

bienvenida.textContent="Hola "+localStorage.getItem("usuarioActivo");
render();
}

// RENDER
function render(){
listaMascotas.innerHTML="";

mascotas.forEach(m=>{
listaMascotas.innerHTML+=`
<div class="mascota-card">
<img src="${m.img}">
<div>
<h5>${m.nombre}</h5>
<p>${m.tipo}</p>
</div>
</div>`;
});
}

// LOGOUT
function logout(){
localStorage.removeItem("usuarioActivo");
location.reload();
}

// VISTAS
function mostrarRegistro(){
loginSection.classList.add("oculto");
registroSection.classList.remove("oculto");
}

function mostrarLogin(){
registroSection.classList.add("oculto");
loginSection.classList.remove("oculto");
}

// AUTO LOGIN
if(localStorage.getItem("usuarioActivo")){
iniciarApp();
}

</script>

</body>
</html>
